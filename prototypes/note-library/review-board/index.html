<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐篇复核 · 本地资料库</title>
<style>
:root{--bg:#f0f3f9;--paper:#fff;--ink:#202c45;--muted:#69768d;--line:#dce3ee;--blue:#3754ab;--red:#b33c59;--green:#237766}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button,a{touch-action:manipulation}button{color:inherit}a{color:var(--blue)}.top{max-width:1220px;margin:auto;padding:22px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0;font-weight:750;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted);margin:3px 0 0}.export{color:var(--muted);font-size:12px;text-decoration:none;white-space:nowrap}.tools{max-width:1220px;margin:auto;padding:5px 28px 14px}.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.search{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:230px;margin-left:auto}.chip{border:1px solid var(--line);background:transparent;border-radius:7px;padding:7px 11px;font-size:12px;white-space:nowrap}.chip[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.filters{margin-top:9px}.filters .chip{padding:4px 9px;font-size:11px}.count{font-size:12px;color:var(--muted);margin-left:auto}.feedback{max-width:1164px;margin:0 auto 12px;padding:10px 15px;color:var(--red);background:#fff0f3;border-radius:8px}.feedback:empty{display:none}.stage{max-width:1220px;margin:auto;padding:0 28px 12px}.post{display:grid;grid-template-columns: minmax(280px,1fr) minmax(280px,1fr);background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;height:calc(100dvh - 300px);min-height:330px;max-height:760px;box-shadow:0 8px 36px #25396308}.visual{background:#e6ebf4;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.coverbutton{border:0;background:none;padding:18px;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.coverbutton img{width:100%;height:100%;object-fit:contain}.coverlabel{position:absolute;bottom:12px;left:14px;pointer-events:none;background:#ffffffed;border-radius:6px;padding:4px 9px;font-size:11px;color:var(--muted)}.content{padding:26px 28px;overflow:auto;min-width:0}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.badge{background:#edf1fb;color:#50638d;border-radius:5px;padding:3px 7px;font-size:11px}.badge.conflict{background:#fff0df;color:#a06524}.content h2{font-size:25px;line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere;font-weight:700}.author{font-size:12px;color:var(--muted);margin-bottom:17px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.secondary{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 12px;font-size:12px;text-decoration:none;display:inline-block}.bodytext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:14px}.evidence{color:var(--muted);border-top:1px solid var(--line);padding-top:15px;margin-top:22px;font-size:12px}.notearea{margin-top:18px}.notearea summary{cursor:pointer;color:var(--blue);font-size:12px}.notearea textarea{display:block;border:1px solid var(--line);border-radius:7px;width:100%;min-height:75px;padding:9px;margin:9px 0;resize:vertical}.empty{background:white;border:1px solid var(--line);border-radius:15px;text-align:center;padding:80px 20px}.empty h2{font-size:24px}.empty p{color:var(--muted)}.actions{position:sticky;bottom:0;background:rgba(240,243,249,.97);backdrop-filter:blur(12px);padding:10px 20px 14px;z-index:2}.actionrow{max-width:770px;margin:auto;display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr;gap:10px}.action{border:1px solid var(--line);background:white;border-radius:11px;padding:13px 9px;font-size:15px;font-weight:650;display:flex;justify-content:center;gap:10px;align-items:center}.action.delete{color:var(--red);border-color:#e5b2c0;background:#fff4f7}.action.keep{color:white;background:var(--green);border-color:var(--green)}kbd{font-family:ui-monospace,monospace;font-size:13px;font-weight:400;opacity:.8}.hint{text-align:center;font-size:11px;color:var(--muted);margin:9px 0 0}.live{color:var(--green);min-height:19px;text-align:center;font-size:12px;margin-top:6px}dialog{width:min(950px,calc(100% - 28px));max-height:90dvh;border:1px solid var(--line);border-radius:14px;padding:0;color:var(--ink);background:white}dialog::backdrop{background:#17243a99;backdrop-filter:blur(3px)}.detailbar{position:sticky;top:0;z-index:1;background:white;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.detailbar h2{margin:0;font-size:15px}.close{background:transparent;border:0;font-size:25px;padding:0 6px}.detailcontent{padding:22px}.gallery{display:grid;gap:16px;margin-top:20px}.gallery img,.gallery video{width:100%;max-height:75dvh;object-fit:contain;background:var(--bg);border-radius:6px}.gallery audio{width:100%}.gallery a{overflow-wrap:anywhere}@media(max-width:900px){.top{padding:17px 18px 9px}.tools{padding:4px 18px 12px}.stage{padding:0 18px 8px}.post{grid-template-columns:minmax(240px,1fr) minmax(240px,1fr)}.content{padding:20px}.content h2{font-size:22px}.search{width:185px}.coverbutton{padding:10px}}@media(max-width:620px){.top{align-items:flex-start}h1{font-size:21px}.export{font-size:10px}.search{width:100%;order:2}.count{margin-left:0}.post{display:block;height:auto;max-height:none;min-height:0}.visual{height:48dvh;min-height:250px}.content{max-height:45dvh}.actionrow{gap:6px}.action{font-size:13px;padding:13px 4px;gap:5px}.actions{padding:9px 12px}.stage{padding:0 12px 8px}.tools{padding:4px 12px 12px}.hint{font-size:10px}.sub{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header class="top"><div><h1>逐篇复核</h1><p class="sub">点赞快照 09-16 · 收藏快照 09-20</p></div><a class="export" href="/api/export" download>导出复核结果 ↗</a></header>
<section class="tools" aria-label="筛选帖子"><div class="toolrow" id="views"><button class="chip" data-view="pending" aria-pressed="true">待决定</button><button class="chip" data-view="keep" aria-pressed="false">已保留</button><button class="chip" data-view="delete" aria-pressed="false">待删除</button><button class="chip" data-view="all" aria-pressed="false">全部</button><input class="search" id="search" type="search" placeholder="搜索标题、作者、正文" aria-label="搜索帖子"></div><div class="toolrow filters"><button class="chip" id="collected" aria-pressed="false">最新仍收藏</button><button class="chip" id="conflict" aria-pressed="false">点赞状态冲突</button><button class="chip" id="video" aria-pressed="false">仅视频</button><span class="count" id="count"></span></div></section>
<div class="feedback" id="feedback" role="alert"></div><main class="stage" id="stage" aria-label="当前帖子"></main>
<footer class="actions"><div class="actionrow"><button class="action delete" id="delete" aria-keyshortcuts="ArrowLeft"><kbd>←</kbd> 删除</button><button class="action keep" id="keep" aria-keyshortcuts="ArrowRight">保留 <kbd>→</kbd></button><button class="action" id="skip" aria-keyshortcuts="ArrowDown">跳过 <kbd>↓</kbd></button><button class="action" id="undo" aria-keyshortcuts="z">撤销 <kbd>Z</kbd></button></div><p class="hint">删除会标记为「待删除」，暂不移除文件。跳过不作决定；不会修改小红书上的点赞或收藏。</p><div class="live" id="live" role="status" aria-live="polite"></div></footer>
<dialog id="detail"><div class="detailbar"><h2 id="detailtitle"></h2><button class="close" id="close" aria-label="关闭详情">×</button></div><article class="detailcontent"><div class="bodytext" id="detailbody"></div><div class="gallery" id="gallery"></div></article></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const LEGACY={pending:'未核对点赞',unliked:'确认已取消点赞',still_liked:'仍然点赞',uncertain:'无法确认'};
let data={notes:[],reviews:{}},queue=[],view='pending',current=null,saving=false,lockedUntil=0,undoStack=[],drafts=new Map();
const filters={collected:false,conflict:false,video:false};
function author(n){return typeof n.author==='string'?n.author:(n.author?.name||n.author?.nickname||'作者未知');}
function isConflict(n){return /conflict|false|冲突/i.test(String(n.reason||''));}
function review(id){return data.reviews[id]||{status:'pending',note:'',decision:null};}
function decision(id){return ['keep','delete'].includes(review(id).decision)?review(id).decision:null;}
function safeUrl(value,external=false){if(typeof value!=='string'||!value)return '';try{const u=new URL(value,location.href);return(external?['http:','https:'].includes(u.protocol):u.origin===location.origin)?u.href:'';}catch{return '';}}
function error(text){$('feedback').textContent=text;}
function matches(n){const q=$('search').value.trim().toLowerCase(),d=decision(n.id);return(view==='all'||(view==='pending'?!d:d===view))&&(!filters.collected||n.collected)&&(!filters.conflict||isConflict(n))&&(!filters.video||n.type==='video')&&(!q||[n.title,author(n),n.body,n.id].join(' ').toLowerCase().includes(q));}
function available(){return queue.map(id=>data.notes.find(n=>n.id===id)).filter(n=>n&&matches(n));}
function captureDraft(){const input=$('postnote');if(current&&input)drafts.set(current.id,input.value);}
function controls(){const disabled=saving||Date.now()<lockedUntil;for(const id of ['delete','keep','skip'])$(id).disabled=disabled||!current;$('undo').disabled=disabled||!undoStack.length;for(const e of document.querySelectorAll('.tools button,.tools input,#savenote'))e.disabled=saving;}
function lock(){lockedUntil=Date.now()+280;controls();setTimeout(controls,300);}
function render(preferId){const list=available();current=list.find(n=>n.id===preferId)||list[0]||null;const counts={pending:0,keep:0,delete:0};for(const n of data.notes)counts[decision(n.id)||'pending']++;const names={pending:'待决定',keep:'已保留',delete:'待删除',all:'全部'};for(const b of $('views').querySelectorAll('button')){b.textContent=names[b.dataset.view]+' '+(b.dataset.view==='all'?data.notes.length:counts[b.dataset.view]);b.setAttribute('aria-pressed',String(view===b.dataset.view));}$('count').textContent=`当前筛选 ${list.length} 篇`;$('stage').replaceChildren();if(!current){const empty=el('div','empty');empty.append(el('h2','',data.notes.length?'这里已没有待看的帖子':'正在载入帖子…'),el('p','',data.notes.length?'切换上方分类，或清除筛选条件继续查看。':'请稍候'));$('stage').append(empty);controls();return;}const n=current,post=el('article','post'),visual=el('div','visual'),cover=el('button','coverbutton');cover.setAttribute('aria-label','查看全部图片和视频：'+n.title);const url=safeUrl(n.cover);if(url){const img=el('img');img.src=url;img.alt=n.title||'帖子封面';img.onerror=()=>{img.remove();cover.append(el('span','','封面无法载入，点击查看正文'));};cover.append(img);}else cover.append(el('span','','点击查看本地详情'));cover.onclick=()=>openDetail(n);visual.append(cover,el('span','coverlabel',(n.type==='video'?'视频':'图文')+' · 点击查看全部媒体'));const content=el('section','content'),badges=el('div','badges');if(n.collected)badges.append(el('span','badge','最新仍收藏'));if(isConflict(n))badges.append(el('span','badge conflict','点赞状态冲突'));if(decision(n.id))badges.append(el('span','badge',decision(n.id)==='keep'?'已保留':'待删除'));if(review(n.id).status&&review(n.id).status!=='pending')badges.append(el('span','badge','旧复核：'+(LEGACY[review(n.id).status]||review(n.id).status)));content.append(badges,el('h2','',n.title||'无标题'),el('div','author',author(n)));const links=el('div','links'),details=el('button','secondary','全部图片 / 视频');details.onclick=()=>openDetail(n);links.append(details);const original=safeUrl(n.source_url,true);if(original){const a=el('a','secondary','打开原帖 ↗');a.href=original;a.target='_blank';a.rel='noopener noreferrer';links.append(a);}content.append(links,el('div','bodytext',n.body||'此条没有可显示的正文。'));const notes=el('details','notearea'),note=el('textarea');note.id='postnote';note.maxLength=5000;note.setAttribute('aria-label','复核备注');note.placeholder='补充你的判断依据…';note.value=drafts.has(n.id)?drafts.get(n.id):(review(n.id).note||'');note.oninput=()=>drafts.set(n.id,note.value);const save=el('button','secondary','保存备注');save.id='savenote';save.onclick=()=>saveNote();notes.append(el('summary','',note.value?'查看 / 编辑备注':'添加备注'),note,save);content.append(notes,el('p','evidence',isConflict(n)?'这篇出现在最新点赞列表中，但点赞字段为 false。保留或删除是本地整理决定，与点赞状态分开记录。':'旧记录有点赞证据，最新点赞列表未收录。可能取消点赞、帖子失效或导出遗漏，请结合内容决定是否保留。'));post.append(visual,content);$('stage').append(post);controls();}
async function persist(id,value,note){error('');try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision:value,note})});if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();if(!result.ok||!result.review)throw Error('保存响应不完整');data.reviews[id]=result.review;return true;}catch(e){error('保存失败，当前帖子没有跳过。请检查本地服务后重试。'+e.message);return false;}}
async function choose(value){if(saving||Date.now()<lockedUntil||!current)return;captureDraft();const n=current,before={id:n.id,decision:decision(n.id),note:review(n.id).note||''};saving=true;controls();$('live').textContent='正在保存…';const ok=await persist(n.id,value,drafts.get(n.id)??before.note);saving=false;if(ok){undoStack.push(before);drafts.delete(n.id);queue=queue.filter(id=>id!==n.id);queue.push(n.id);$('live').textContent=value==='keep'?'已保留，继续下一篇':'已标记待删除，继续下一篇';lock();render();}else{$('live').textContent='尚未保存';controls();}}
function skip(){if(saving||Date.now()<lockedUntil||!current)return;captureDraft();const id=current.id;queue=queue.filter(x=>x!==id);queue.push(id);$('live').textContent='已移到本轮队尾，未作决定';lock();render();}
async function undo(){if(saving||Date.now()<lockedUntil||!undoStack.length)return;captureDraft();const previous=undoStack[undoStack.length-1];saving=true;controls();const ok=await persist(previous.id,previous.decision,previous.note);saving=false;if(ok){undoStack.pop();drafts.delete(previous.id);queue=queue.filter(id=>id!==previous.id);queue.unshift(previous.id);const n=data.notes.find(n=>n.id===previous.id);if(!matches(n)){view='all';$('search').value='';for(const k of Object.keys(filters)){filters[k]=false;$(k).setAttribute('aria-pressed','false');}}$('live').textContent='已撤销上一次决定';lock();render(previous.id);}else controls();}
async function saveNote(){if(!current||saving)return;captureDraft();const id=current.id;saving=true;controls();const ok=await persist(id,decision(id),drafts.get(id)||'');saving=false;if(ok){drafts.delete(id);$('live').textContent='备注已保存';}controls();}
function openDetail(n){$('detailtitle').textContent=n.title||'无标题';$('detailbody').textContent=n.body||'';$('gallery').replaceChildren();for(const m of n.media||[]){const url=safeUrl(m.url);if(!url)continue;let e;if(m.kind==='image'){e=el('img');e.src=url;e.loading='lazy';e.alt='帖子图片';}else if(['video','audio'].includes(m.kind)){e=el(m.kind);e.src=url;e.controls=true;e.preload='none';}else{e=el('a','',m.kind==='subtitle'?'查看字幕':'查看附件');e.href=url;e.target='_blank';e.rel='noopener noreferrer';}$('gallery').append(e);}$('detail').showModal();$('detail').scrollTop=0;}
function closeDetail(){for(const m of $('gallery').querySelectorAll('video,audio'))m.pause();$('detail').close();}
$('close').onclick=closeDetail;$('detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});$('delete').onclick=()=>choose('delete');$('keep').onclick=()=>choose('keep');$('skip').onclick=skip;$('undo').onclick=undo;
for(const b of $('views').querySelectorAll('button'))b.onclick=()=>{captureDraft();view=b.dataset.view;render();};for(const k of Object.keys(filters))$(k).onclick=()=>{captureDraft();filters[k]=!filters[k];$(k).setAttribute('aria-pressed',String(filters[k]));render();};$('search').oninput=()=>{captureDraft();render();};
document.addEventListener('keydown',e=>{const t=e.target;if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||$('detail').open||t.closest('input,textarea,select,video,audio,[contenteditable]:not([contenteditable="false"])')||t.isContentEditable)return;const actions={ArrowLeft:()=>choose('delete'),ArrowRight:()=>choose('keep'),ArrowDown:skip,z:undo,Z:undo};if(actions[e.key]){e.preventDefault();actions[e.key]();}});
(async()=>{try{const r=await fetch('/api/board');if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();if(!Array.isArray(result.notes))throw Error('数据格式不正确');data={...result,reviews:result.reviews||{}};queue=data.notes.map(n=>n.id);render();}catch(e){error('无法载入看板，请确认本地服务已启动。'+e.message);$('stage').textContent='无法载入帖子；恢复服务后刷新页面。';controls();}})();controls();
</script></body></html>
